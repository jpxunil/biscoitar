renderVals() {
var K = {
purple: { bg: '#9E5CFF', art: '#7A3FE0', st: '#5B2BB8', eb: '#2E1766', eg: '#5B2BB8' },
gold: { bg: '#FFCC40', art: '#F2A91E', st: '#C9871A', eb: '#4A2E12', eg: '#8A5A1E' },
white: { bg: '#F7F1DC', art: '#E6D9B4', st: '#CDBB8A', eb: '#4D4636', eg: '#8C7F5C' },
item: { bg: '#4DE6FF', art: '#35C4E6', st: '#1E9FC0', eb: '#123A4A', eg: '#1E9FC0' }
};
var G = {
attack: 'M12 1L16 7V15H20V18H14V23H10V18H4V15H8V7Z',
defense: 'M3 3H21V12C21 18 16 21.5 12 23C8 21.5 3 18 3 12Z',
utility: 'M12 2A10 10 0 1 1 12 22A10 10 0 1 1 12 2ZM12 8A4 4 0 1 0 12 16A4 4 0 1 0 12 8Z',
special: 'M12 1L15 9L23 12L15 15L12 23L9 15L1 12L9 9Z'
};
function mk(o) {
var k = K[o.kind];
var price = o.price || 0;
var m = o.pips || 0;
return {
x: o.x, y: o.y, rot: o.rot || 0, sc: o.sc || 1, z: o.z || 1,
face: o.state === 'face' || o.state === 'dim',
back: o.state === 'back',
empty: o.state === 'empty',
dim: o.state === 'dim',
solid: o.state !== 'empty',
focus: !!o.focus,
name: o.name || '', fs: (o.name || '').length > 13 ? 10 : 12,
bg: k.bg, art: k.art, st: k.st, eb: k.eb, eg: k.eg,
glyph: G[o.cat || 'special'],
suits: !price, priced: !!price, price: price,
p1: m > 0 ? '#FFCC40' : '#1E2460', p2: m > 1 ? '#FFCC40' : '#1E2460', p3: m > 2 ? '#FFCC40' : '#1E2460'
};
}
var cards = [];
// slots equipados (Tank)
cards.push(mk({ x: 60, y: 96, kind: 'purple', state: 'face', name: 'Rotação', cat: 'attack' }));
cards.push(mk({ x: 176, y: 96, kind: 'purple', state: 'empty' }));
cards.push(mk({ x: 308, y: 96, kind: 'gold', state: 'face', name: 'Guarda', cat: 'defense' }));
cards.push(mk({ x: 424, y: 96, kind: 'gold', state: 'face', name: 'Biscoiteiro', cat: 'utility' }));
cards.push(mk({ x: 540, y: 96, kind: 'gold', state: 'empty' }));
cards.push(mk({ x: 118, y: 240, kind: 'white', state: 'face', name: 'Desvio', cat: 'defense' }));
cards.push(mk({ x: 234, y: 240, kind: 'white', state: 'face', name: 'Laranja Junto', cat: 'utility' }));
cards.push(mk({ x: 350, y: 240, kind: 'white', state: 'face', name: 'Couraça', cat: 'defense' }));
cards.push(mk({ x: 466, y: 240, kind: 'white', state: 'empty' }));
cards.push(mk({ x: 741, y: 184, kind: 'item', state: 'face', name: 'Poção', cat: 'utility', rot: 3 }));
// mão na roleta: centro (450, 1100), raio 560, passo 13 graus
var CX = 450, CY = 1100, STEP = 13;
var hand = [
{ kind: 'white', state: 'back', pips: 0 },
{ kind: 'white', state: 'face', name: 'Dispersão', cat: 'utility' },
{ kind: 'gold', state: 'face', name: 'Carrasco', cat: 'attack' },
{ kind: 'purple', state: 'face', name: 'Fênix', cat: 'special', focus: true },
{ kind: 'white', state: 'dim', name: 'Cautela', cat: 'defense' },
{ kind: 'gold', state: 'back', pips: 2 },
{ kind: 'white', state: 'back', pips: 1 }
];
hand.forEach(function (h, i) {
var deg = (i - 3) * STEP;
var a = deg * Math.PI / 180;
var R = h.focus ? 574 : 560;
h.x = Math.round(CX + R * Math.sin(a) - 54);
h.y = Math.round(CY - R * Math.cos(a) - 76);
h.rot = deg;
h.sc = h.focus ? 1.15 : 1;
h.z = h.focus ? 5 : 2;
cards.push(mk(h));
});
var ticks = [];
for (var k = -4; k < 4; k++) {
var d = (k + 0.5) * STEP, r = d * Math.PI / 180;
ticks.push({ x: Math.round(CX + 659 * Math.sin(r) - 3), y: Math.round(CY - 659 * Math.cos(r) - 7), rot: d });
}
return { cards: cards, ticks: ticks };
}
}
</script>
