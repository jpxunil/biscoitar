<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Bowlby+One&display=swap">
<style>
body{margin:0}
.spoke{transition:transform .5s cubic-bezier(.25,1.35,.45,1)}
.spoke:hover{z-index:9 !important}
.hcard{transition:scale .22s cubic-bezier(.3,1.6,.5,1),rotate .22s ease-out,translate .22s ease-out,opacity .15s}
.deal{animation:deal .42s cubic-bezier(.3,1.5,.5,1) backwards}
.ghostspoke{pointer-events:none}
.hcard.ghost{scale:1.15;rotate:7deg;transition:none}
.lifted{opacity:.25}
.sel{outline:5px solid #FFCC40;outline-offset:3px;border-radius:12px;scale:1.06}
.target{outline:4px solid #F7F1DC;outline-offset:4px;border-radius:12px;animation:target .7s ease-in-out infinite}
.target.over{outline-color:#FFCC40;outline-width:6px;animation:none;scale:1.1}
.dropped{animation:drop .35s cubic-bezier(.3,1.7,.5,1)}
.dragging,.dragging *{cursor:grabbing !important}
@keyframes target{50%{outline-offset:9px}}
@keyframes drop{from{scale:1.35;rotate:8deg}}
.hcard:hover{scale:1.09;rotate:-3deg;translate:0 -12px}
.hcard.alt:hover{rotate:3deg}
.hcard.is-focus{scale:1.15;translate:0 -14px}
.hcard.is-focus:hover{scale:1.2;rotate:2deg;translate:0 -18px}
.hcard:active{scale:1.02}
.halo{animation:pulse 1.1s ease-in-out infinite}
.hero-art{animation:heroFloat 3.6s ease-in-out infinite;transform-origin:50% 80%;will-change:transform}
@keyframes heroFloat{0%,100%{transform:translateY(6px) rotate(-1deg)}50%{transform:translateY(-14px) rotate(1.4deg)}}
.float2{animation:float2 3.4s ease-in-out infinite}
.drift{animation:drift 7s ease-in-out infinite alternate}
.bob{animation:bob 1s ease-in-out infinite}
.btn{overflow:hidden;transition:scale .14s cubic-bezier(.3,1.8,.5,1),translate .1s,background-color .12s,color .12s}
.btn::after{content:"";position:absolute;top:-30%;left:-60%;width:28%;height:160%;background:#fff;opacity:.8;transform:skewX(-22deg);pointer-events:none}
.btn:hover{scale:1.08}
.btn:hover::after{animation:plin .45s ease-out}
.btn:active{scale:.94;translate:2px 3px}
.btn-gold:hover{background:#F7F1DC !important}
.btn-paper:hover{background:#121429 !important;color:#F7F1DC !important}
.face:hover img{opacity:1 !important}
.ready{animation:ready 1.6s ease-in-out infinite}
.ready::after{animation:plinIdle 3.2s ease-out infinite}
.ready:hover{animation:none;scale:1.05}
.ready:hover .ready-face{background:#FFE48A !important}
.ready:hover .ready-txt{color:#B01818 !important}
@keyframes deal{from{opacity:0;translate:0 40px;scale:.7}}
@keyframes pulse{50%{scale:1.05}}
@keyframes float{50%{translate:0 -10px;rotate:1.2deg}}
@keyframes float2{50%{translate:0 -5px;rotate:-1.5deg}}
@keyframes drift{from{translate:-10px 4px}to{translate:12px -5px}}
@keyframes bob{50%{translate:0 5px}}
@keyframes ready{50%{scale:1.03;rotate:-.6deg}}
@keyframes plin{from{left:-60%}to{left:160%}}
@keyframes plinIdle{0%{left:-60%}14%{left:160%}100%{left:160%}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["Maga","Tank","Healer","Assassina"],"default":"Maga","section":"Tema do herói"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
// ponto do ponteiro em coordenadas da tela 1280x720, qualquer que seja o zoom
pt(e) {
var r = e.currentTarget.getBoundingClientRect();
var k = r.width / 1280;
return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k };
}
slotAt(x, y) {
var s = this._v.slots;
for (var i = 0; i < s.length; i++) {

}

}

var st = this.state || {};

var dx = e.clientX - p.sx, dy = e.clientY - p.sy;
if (dx * dx + dy * dy < 36) return;

this.setState({ drag: { src: p.info.src, idx: p.info.idx, card: p.info.card, x: pt.x, y: pt.y }, over: ok ? si : -1 });
}
onUp(e) {
var p = this._pend;
this._pend = null;
var drag = (this.state || {}).drag;
if (!p || !drag) return;
var v = this._v, pt = this.pt(e), si = this.slotAt(pt.x, pt.y);
var eq = v.EQ.slice(), hand = v.HAND.slice(), f = v.f;
var next = { drag: null, over: -1, sel: null };
if (si >= 0 && v.slots[si].kind === drag.card.kind) {
if (drag.src === 'hand') {
// mão -> slot: equipa; se o slot estava ocupado, a carta antiga volta pro mesmo lugar da mão
var old = eq[si];
eq[si] = drag.card;
if (old) hand[drag.idx] = old; else hand.splice(drag.idx, 1);
next.focus = Math.max(0, Math.min(hand.length - 1, old ? drag.idx : (f > drag.idx ? f - 1 : f)));
} else if (si !== drag.idx) {
// slot -> slot da mesma raridade: troca
var o = eq[si];
eq[si] = drag.card;
eq[drag.idx] = o || null;
}
next.eq = eq; next.hand = hand; next.drop = 's' + si;
} else if (drag.src === 'slot') {
// slot -> roleta: desequipa e a carta entra na mão já em foco
var dx = pt.x - 450, dy = pt.y - 1100;
if (dx * dx + dy * dy < 672 * 672) {
eq[drag.idx] = null;
hand.splice(f, 0, drag.card);
next.eq = eq; next.hand = hand; next.focus = f; next.drop = 'h' + f;
}
}
this.setState(next);
}
onLeave() {
this._pend = null;
if (this.state && this.state.drag) this.setState({ drag: null, over: -1 });
}
renderVals() {
var self = this;
var T = {
Maga: { bg: '#E08A14', bg2: '#FFC233', deep: '#2B1509', deep2: '#4A2612', acc: '#C4201C', accT: '#F7F1DC' },
Tank: { bg: '#2B4FBF', bg2: '#4D80FF', deep: '#121A4A', deep2: '#1E2A6E', acc: '#FFCC40', accT: '#121429' },
Healer: { bg: '#1F8A4C', bg2: '#3FB86B', deep: '#0E3320', deep2: '#175030', acc: '#FFCC40', accT: '#121429' },
Assassina: { bg: '#5B2BB8', bg2: '#7A3FE0', deep: '#1E2460', deep2: '#2B3384', acc: '#FF5999', accT: '#121429' }
};
var th = T[this.props.tema] || T.Maga;
var K = {
purple: { bg: '#9E5CFF', art: '#7A3FE0', st: '#5B2BB8', eb: '#2E1766', eg: '#5B2BB8', label: 'ÉPICA', chipBg: '#5B2BB8', chipT: '#F7F1DC' },
gold: { bg: '#FFCC40', art: '#F2A91E', st: '#C9871A', eb: '#4A2E12', eg: '#8A5A1E', label: 'RARA', chipBg: '#FFCC40', chipT: '#121429' },
white: { bg: '#F7F1DC', art: '#E6D9B4', st: '#CDBB8A', eb: '#4D4636', eg: '#8C7F5C', label: 'COMUM', chipBg: '#4D4636', chipT: '#F7F1DC' },
item: { bg: '#4DE6FF', art: '#35C4E6', st: '#1E9FC0', eb: '#123A4A', eg: '#1E9FC0', label: 'ITEM', chipBg: '#4DE6FF', chipT: '#121429' }
};
var G = {
attack: 'M12 1L16 7V15H20V18H14V23H10V18H4V15H8V7Z',
defense: 'M3 3H21V12C21 18 16 21.5 12 23C8 21.5 3 18 3 12Z',
utility: 'M12 2A10 10 0 1 1 12 22A10 10 0 1 1 12 2ZM12 8A4 4 0 1 0 12 16A4 4 0 1 0 12 8Z',
special: 'M12 1L15 9L23 12L15 15L12 23L9 15L1 12L9 9Z'
};

function mk(o) {
var k = K[o.kind];
var m = o.pips || 0;
var hover = o.state !== 'empty';
return {
ox: o.ox, oy: o.oy, ty: o.ty, deg: o.deg || 0, rot: o.rot || 0, z: o.z || 1,
cls: (o.ghost ? 'hcard ghost' : (hover ? 'hcard' : 'slot')) + (o.focus ? ' is-focus' : '') + (o.alt ? ' alt' : '') + (o.extra || ''),
scls: o.ghost ? 'ghostspoke' : 'spoke deal',
cur: o.cur || 'default',

down: o.down || function () {},
aria: o.name || (o.state === 'back' ? 'Carta não conquistada' : 'Slot vazio'),
face: o.state === 'face' || o.state === 'dim',

solid: o.state !== 'empty',
focus: !!o.focus,
name: o.name || '', fs: (o.name || '').length > 13 ? 10 : 12,

};
}
var cards = [];
// slots equipados (Maga): origem do raio = centro da carta, sem giro
var slots = [
{ x: 60, y: 96, kind: 'purple', state: 'face', name: 'Rotação', cat: 'attack' },
{ x: 176, y: 96, kind: 'purple', state: 'empty' },
{ x: 308, y: 96, kind: 'gold', state: 'face', name: 'Golpe Lapidado', cat: 'attack' },
{ x: 424, y: 96, kind: 'gold', state: 'face', name: 'Carrasco', cat: 'attack' },
{ x: 540, y: 96, kind: 'gold', state: 'empty' },
{ x: 118, y: 240, kind: 'white', state: 'face', name: 'Desvio', cat: 'defense' },
{ x: 234, y: 240, kind: 'white', state: 'face', name: 'Cautela', cat: 'defense' },
{ x: 350, y: 240, kind: 'white', state: 'face', name: 'Dispersão', cat: 'utility' },
{ x: 466, y: 240, kind: 'white', state: 'empty' },
{ x: 741, y: 184, kind: 'item', state: 'face', name: 'Biscoito da Sorte', cat: 'special', rot: 3 }
];
var DESC = {
'Rotação': 'Bate mais forte. Assassina e Maga soltam o golpe de 20 s sempre que dá.',
'Golpe Lapidado': 'Golpe forte melhor. Maga: conjura 0,7 s mais rápido e +15%.',
'Carrasco': '+25% de dano com a boss abaixo de 30% de vida.',
'Desvio': 'Sai dos ataques vermelhos.',
'Cautela': 'Não conjura em cima de ataque vermelho.',
'Dispersão': 'No círculo roxo, corre pro próprio canto da arena.',
'Biscoito da Sorte': 'O Limit Break começa a luta com 25% de carga.'
};
var st = this.state || {};
var EQ = st.eq || slots.map(function (s) {
return s.state === 'face' ? { kind: s.kind, state: 'face', name: s.name, cat: s.cat, desc: DESC[s.name] || '' } : null;
});
var drag = st.drag || null, over = st.over == null ? -1 : st.over, drop = st.drop || '';
// carta equipada selecionada por clique: os detalhes mostram ela em vez da carta em foco na roleta
var sel = st.sel != null && EQ[st.sel] ? st.sel : -1;
slots.forEach(function (s, i) {
var c = EQ[i];
var lifted = !!drag && drag.src === 'slot' && drag.idx === i;
var v = c ? { kind: c.kind, state: 'face', name: c.name, cat: c.cat } : { kind: s.kind, state: 'empty' };
v.ox = s.x + 54; v.oy = s.y + 76; v.ty = -76; v.rot = s.rot || 0; v.alt = i % 2 === 1; v.delay = i * 45;
v.extra = (lifted ? ' lifted' : '') + (drag && drag.card.kind === s.kind && !lifted ? ' target' : '') + (over === i ? ' over' : '') + (drop === 's' + i ? ' dropped' : '') + (sel === i && !drag ? ' sel' : '');
v.cur = c ? 'grab' : 'default';
if (c) v.down = function (e) { self.onDown(e, { src: 'slot', idx: i, card: c }); };
if (c) v.pick = function () { self.setState({ sel: i }); };
cards.push(mk(v));
});
// mão na roleta: origem do raio = centro da roleta (450, 1100); a carta fica a 560 do centro
var hand = [
{ kind: 'white', state: 'back', pips: 0 },
{ kind: 'white', state: 'face', name: 'Laranja Junto', cat: 'utility', desc: 'Corre pro círculo laranja pra dividir o dano com a party.' },
{ kind: 'white', state: 'face', name: 'Dupla Laranja', cat: 'utility', desc: 'Com dois círculos laranjas, forma dupla: dois em cada.' },
{ kind: 'gold', state: 'face', name: 'Faísca de Limite', cat: 'utility', desc: 'O dano dele enche o Limit Break 50% mais rápido.' },
{ kind: 'white', state: 'face', name: 'Lâmina Afiada', cat: 'attack', desc: '+8% de dano.' },
{ kind: 'purple', state: 'face', name: 'Fênix', cat: 'special', desc: 'Uma vez por luta, em vez de morrer, volta com metade da vida.' },
{ kind: 'gold', state: 'dim', name: 'Guarda', cat: 'defense', desc: 'Usa Mitigação quando a boss prepara o Esmagar.' },
{ kind: 'gold', state: 'back', pips: 2 },
{ kind: 'gold', state: 'face', name: 'Segunda Pele', cat: 'defense', desc: 'Começa a luta, e volta de um reviver, com um escudo de 30.' },
{ kind: 'item', state: 'face', name: 'Poção', cat: 'utility', desc: 'Uma vez por luta, cura 50 quando a vida cai abaixo de 30%.' },
{ kind: 'white', state: 'back', pips: 1 },
{ kind: 'purple', state: 'face', name: 'Sobrecarga', cat: 'attack', desc: '+20% de dano, mas recebe 15% a mais.' }
];
var HAND = st.hand || hand;
var STEP = 13, last = Math.max(0, HAND.length - 1);
var f = Math.min(last, st.focus != null ? st.focus : 5);
HAND.forEach(function (h, i) {
var can = h.state === 'face';
var lifted = !!drag && drag.src === 'hand' && drag.idx === i;
var v = { kind: h.kind, state: h.state, name: h.name, cat: h.cat, pips: h.pips };
v.ox = 450; v.oy = 1100; v.ty = -636; v.deg = (i - f) * STEP;
v.focus = i === f && sel < 0; v.z = i === f ? 5 : 2; v.alt = i % 2 === 1; v.delay = 350 + i * 40;
v.extra = (lifted ? ' lifted' : '') + (drop === 'h' + i ? ' dropped' : '');
v.cur = can ? 'grab' : 'not-allowed';
v.pick = function () { self.setState({ focus: i, sel: null }); };
if (can) v.down = function (e) { self.onDown(e, { src: 'hand', idx: i, card: h }); };

});

if (drag) cards.push(mk({ kind: drag.card.kind, state: 'face', name: drag.card.name, cat: drag.card.cat, ox: Math.round(drag.x), oy: Math.round(drag.y), ty: -76, z: 60, ghost: true, cur: 'grabbing' }));
this._v = { slots: slots, EQ: EQ, HAND: HAND, f: f };
var ticks = [];
for (var k = -9; k < 26; k++) ticks.push({ deg: (k + 0.5 - f) * STEP });
var cur = (sel >= 0 ? EQ[sel] : null) || HAND[f] || { kind: 'white', state: 'face', name: '—', cat: 'special', desc: '' }, ck = K[cur.kind];
var d = {

};

cards: cards, ticks: ticks, d: d,
rootCls: drag ? 'dragging' : '',
onMove: function (e) { self.onMove(e); },
onUp: function (e) { self.onUp(e); },
onLeave: function () { self.onLeave(); },
prev: function () { self.setState({ focus: Math.max(0, f - 1), sel: null }); },
next: function () { self.setState({ focus: Math.min(last, f + 1), sel: null }); },
bg: th.bg, bg2: th.bg2, deep: th.deep, deep2: th.deep2, acc: th.acc, accT: th.accT
};
}
